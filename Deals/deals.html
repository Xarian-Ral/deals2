<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Confidants</title>

    <link rel="stylesheet" href="style/style.css">
</head>

<body>

    <!-- Background changer button -->
    <button class="bg-btn" onclick="changeBackground()">Change Background</button>

    <h1 class="title">Confidants</h1>

    <div class="form">
        <input type="text" id="name" placeholder="Person's Name">
        <input type="text" id="description" placeholder="Description">
        <button onclick="addConfidant()">Add</button>
    </div>

    <ul id="confidantList"></ul>

    <script>
        let confidants = JSON.parse(localStorage.getItem("confidants")) || [];

        // Load saved background
        const savedBackground = localStorage.getItem("backgroundImage");
        if (savedBackground) {
            document.body.style.backgroundImage = `url(${savedBackground})`;
        }

        function saveData() {
            localStorage.setItem("confidants", JSON.stringify(confidants));
        }

        function renderConfidants() {
            const list = document.getElementById("confidantList");
            list.innerHTML = "";

            confidants.forEach((c, index) => {
                const li = document.createElement("li");

                li.innerHTML = `
                    <div class="confidant-left">
                        <img src="${c.img || 'images/default.png'}" class="profile-img">
                    </div>

                    <div class="confidant-info">
                        <span class="confidant-name">${c.name}</span>
                        <span class="confidant-desc">${c.desc}</span>
                    </div>

                    <div class="actions">
                        <input type="file" accept="image/*" onchange="uploadImage(event, ${index})">
                        <button onclick="editConfidant(${index})">Edit</button>
                        <button onclick="deleteConfidant(${index})">Delete</button>
                    </div>
                `;

                list.appendChild(li);
            });
        }

        function addConfidant() {
            const name = document.getElementById("name").value;
            const desc = document.getElementById("description").value;

            if (!name || !desc) return;

            confidants.push({ name, desc, img: "" });

            saveData();
            renderConfidants();

            document.getElementById("name").value = "";
            document.getElementById("description").value = "";
        }

        function deleteConfidant(index) {
            confidants.splice(index, 1);
            saveData();
            renderConfidants();
        }

        function editConfidant(index) {
            const newName = prompt("Edit name:", confidants[index].name);
            const newDesc = prompt("Edit description:", confidants[index].desc);

            if (newName && newDesc) {
                confidants[index].name = newName;
                confidants[index].desc = newDesc;
                saveData();
                renderConfidants();
            }
        }

        function uploadImage(event, index) {
            const file = event.target.files[0];
            if (!file) return;

            const reader = new FileReader();

            reader.onload = function (e) {
                confidants[index].img = e.target.result;
                saveData();
                renderConfidants();
            };

            reader.readAsDataURL(file);
        }

        function changeBackground() {
            const input = document.createElement("input");
            input.type = "file";
            input.accept = "image/*";

            input.onchange = function (event) {
                const file = event.target.files[0];
                if (!file) return;

                const reader = new FileReader();

                reader.onload = function (e) {
                    const imgData = e.target.result;
                    document.body.style.backgroundImage = `url(${imgData})`;
                    localStorage.setItem("backgroundImage", imgData);
                };

                reader.readAsDataURL(file);
            };

            input.click();
        }

        renderConfidants();
    </script>

</body>
</html>

<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Confidants</title>

    <link rel="stylesheet" href="style/style.css">
</head>

<body>

<button class="bg-btn" onclick="changeBackground()">Change Background</button>

<h1 class="title">Confidants</h1>

<div class="form">
    <input type="text" id="name" placeholder="Person's Name">
    <input type="text" id="description" placeholder="Description">
    <button onclick="addConfidant()">Add</button>
</div>

<ul id="confidantList"></ul>

<script>
let confidants = JSON.parse(localStorage.getItem("confidants")) || [];

const arcanas = [
"fool","magician","priestess","empress","emperor","hierophant","lovers",
"chariot","justice","hermit","fortune","strength","hanged man","death",
"temperance","devil","tower","star","sun","world","judgement","faith","councillor"
];

const savedBackground = localStorage.getItem("backgroundImage");
if (savedBackground) {
    document.body.style.backgroundImage = `url(${savedBackground})`;
}

function saveData() {
    localStorage.setItem("confidants", JSON.stringify(confidants));
}

/* AUTO RESIZE FOR TEXTAREAS */
function autoResize(el) {
    el.style.height = "auto";
    el.style.height = el.scrollHeight + "px";
}

function renderConfidants() {
    const list = document.getElementById("confidantList");
    list.innerHTML = "";

    confidants.forEach((c, index) => {

        const arcanaOptions = `
            <option value="" ${!c.arcana ? "selected" : ""}>None</option>
            ${arcanas.map(a =>
                `<option value="${a}" ${c.arcana === a ? "selected" : ""}>${a}</option>`
            ).join("")}
        `;

        const li = document.createElement("li");

        li.innerHTML = `
            <div class="arcana-container">
                <img src="images/arcana/${c.arcana ? c.arcana.replace(/ /g, '-') : 'cardback'}.png"
                     class="arcana-img ${c.reversed ? 'reversed' : ''}">
                <button class="reverse-btn ${c.reversed ? 'active' : ''}"
                        onclick="toggleReverse(${index})"
                        title="Reverse Arcana">⟲</button>
                ${c.reversed ? `<span class="reverse-label">Reverse</span>` : ""}
            </div>

            <div class="confidant-left">
                <img src="${c.img || 'images/default.png'}" class="profile-img">
            </div>

            <div class="confidant-info">

                <!-- NAME FIXED: NOW TEXTAREA -->
                <textarea class="edit-name"
                          disabled
                          oninput="autoResize(this)">${c.name}</textarea>

                <!-- DESCRIPTION -->
                <textarea class="edit-desc"
                          disabled
                          oninput="autoResize(this)">${c.desc}</textarea>

            </div>

            <div class="actions">
                <select onchange="changeArcana(${index}, this.value)">
                    ${arcanaOptions}
                </select>

                <input type="file" accept="image/*"
                       onchange="uploadImage(event, ${index})">

                <button onclick="toggleEdit(this, ${index})">Edit</button>
                <button onclick="deleteConfidant(${index})">Delete</button>
            </div>
        `;

        list.appendChild(li);

        // ensure proper sizing on load
        autoResize(li.querySelector(".edit-name"));
        autoResize(li.querySelector(".edit-desc"));
    });
}

function addConfidant() {
    const name = document.getElementById("name").value;
    const desc = document.getElementById("description").value;

    if (!name || !desc) return;

    confidants.push({
        name,
        desc,
        img: "",
        arcana: "",
        reversed: false
    });

    saveData();
    renderConfidants();

    document.getElementById("name").value = "";
    document.getElementById("description").value = "";
}

function deleteConfidant(index) {
    if (confirm("Are you sure you want to delete this confidant?")) {
        confidants.splice(index, 1);
        saveData();
        renderConfidants();
    }
}

function toggleEdit(btn, index) {
    const li = btn.parentElement.parentElement;

    const nameInput = li.querySelector(".edit-name");
    const descInput = li.querySelector(".edit-desc");

    if (btn.textContent === "Edit") {
        nameInput.disabled = false;
        descInput.disabled = false;
        btn.textContent = "Save";
    } else {
        confidants[index].name = nameInput.value;
        confidants[index].desc = descInput.value;

        nameInput.disabled = true;
        descInput.disabled = true;
        btn.textContent = "Edit";

        saveData();

        autoResize(nameInput);
        autoResize(descInput);
    }
}

function changeArcana(index, value) {
    confidants[index].arcana = value;
    saveData();
    renderConfidants();
}

function toggleReverse(index) {
    confidants[index].reversed = !confidants[index].reversed;
    saveData();
    renderConfidants();
}

function uploadImage(event, index) {
    const file = event.target.files[0];
    if (!file) return;

    const reader = new FileReader();

    reader.onload = function (e) {
        confidants[index].img = e.target.result;
        saveData();
        renderConfidants();
    };

    reader.readAsDataURL(file);
}

function changeBackground() {
    const input = document.createElement("input");
    input.type = "file";
    input.accept = "image/*";

    input.onchange = function (event) {
        const file = event.target.files[0];
        if (!file) return;

        const reader = new FileReader();

        reader.onload = function (e) {
            document.body.style.backgroundImage = `url(${e.target.result})`;
            localStorage.setItem("backgroundImage", e.target.result);
        };

        reader.readAsDataURL(file);
    };

    input.click();
}

renderConfidants();
</script>

</body>
</html>
